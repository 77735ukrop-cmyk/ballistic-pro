name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        # Вказуємо назву вашого головного файлу
        run: flet build apk --module-name ballistic.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # Використовуємо зірочку, щоб знайти APK з будь-якою назвою в цій папці
          path: build/apk/*.apk
